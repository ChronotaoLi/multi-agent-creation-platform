[tool.poetry]
name = "multi-agent-creation-platform"
version = "0.3.2"
description = "多智能体AI创作平台后端"
authors = ["李文帅 <wenshuai_unstoppable@outlook.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.12"
pydantic = "^2.11.0"
pydantic-settings = "^2.9.1"
sqlalchemy = "^2.0.0"
alembic = "^1.13.1"
sqlalchemy-utils = "^0.41.1"
asyncpg = "^0.29.0"
langgraph = "^0.4.5"
redis = "^6.1.0"
psycopg = {extras = ["binary"], version = "^3.1.10"}
pymilvus = "^2.3.0"
neo4j = "^5.15.0"
celery = "^5.5.2"
httpx = "^0.27.0"
tenacity = "^8.2.3"
pybreaker = "^1.3.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
python-multipart = "^0.0.6"
uvicorn = "^0.27.1"
ulid-py = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.3"
black = "^24.1.0"
isort = "^5.13.2"
mypy = "^1.8.0"
ruff = "^0.2.1"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
target-version = "py310"
line-length = 88
select = ["E", "F", "W", "I", "B", "C90"]
ignore = ["E203", "E501"]
